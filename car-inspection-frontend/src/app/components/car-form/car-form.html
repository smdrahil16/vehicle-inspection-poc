<app-navbar></app-navbar>
<div class="container">

    <h2>Vehicle Inspection Form</h2>

    <form>

        <div class="form-group">
            <label>VIN Number</label>
            <input
                    type="text"
                    [(ngModel)]="car.vinNumber"
                    name="vinNumber"
                    required>
        </div>

        <div class="form-group">
            <label>Car Number</label>
            <input
                    type="text"
                    [(ngModel)]="car.carNumber"
                    name="carNumber"
                    required>
        </div>

        <div class="form-group">
            <label>Car Model</label>
            <input
                    type="text"
                    [(ngModel)]="car.carModel"
                    name="carModel"
                    required>
        </div>

        <div class="form-group">
            <label>Inspection Type</label>

            <select
                    [(ngModel)]="car.inspectionType"
                    name="inspectionType">

                <option value="">
                    Select Type
                </option>

                <option value="New Inspection">
                    New Inspection
                </option>

                <option value="Damage Inspection">
                    Damage Inspection
                </option>

            </select>
        </div>

        <div class="form-group">
            <label>Comments</label>

            <textarea
                    [(ngModel)]="car.comments"
                    name="comments">
            </textarea>
        </div>

        <div class="form-group">
            <label>Upload Photo</label>

            <input
                    type="file"
                    (change)="onFileSelected($event)">
        </div>

        <button
                type="button"
                (click)="onSubmit()">

            Submit
        </button>

    </form>

</div>
